name: Build Amber18Diagnostic

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3

      - name: Install patched Theos SDK
        run: |
          rm -rf /tmp/theos-sdks
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Add verified iOS 18.2 ControlCenterUIKit class
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              f"{__import__('os').environ['THEOS']}/sdks/"
              "iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/"
              "ControlCenterUIKit.framework/ControlCenterUIKit.tbd"
          )

          text = path.read_text()

          old = "CCUISliderModuleBackgroundViewController,"
          new = (
              "CCUISliderModuleBackgroundViewController,\n"
              "                            CCUISliderButtonModuleViewController,"
          )

          if "CCUISliderButtonModuleViewController" in text:
              print("Class already present; no patch needed.")
          elif old not in text:
              raise SystemExit(
                  "Expected insertion point not found; refusing to guess."
              )
          else:
              path.write_text(text.replace(old, new, 1))
              print("Added verified CCUISliderButtonModuleViewController export.")
          PY

      - name: Build package
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: Amber18Diagnostic
          path: packages/*.deb
