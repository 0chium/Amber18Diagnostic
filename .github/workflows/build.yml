name: Build Amber18Diagnostic

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3

      - name: Check ControlCenterUIKit SDK files
        run: |
          echo "=== ControlCenterUIKit ==="
          find "$THEOS" -iname '*ControlCenterUIKit*' -print || true
          echo "=== UIUtilities ==="
          find "$THEOS" -iname '*UIUtilities*' -print || true

      - name: Build package
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: Amber18Diagnostic
          path: packages/*.deb
